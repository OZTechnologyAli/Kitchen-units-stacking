<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim Bir Gelecek İnşa Etmek İster?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --navy: #050a2e;
    --blue: #0b1a6b;
    --gold: #f8c840;
    --gold-dark: #b07a10;
    --text: #ffffff;
    --red: #ff4040;
    --pixel: "Press Start 2P", monospace;
    --term: "VT323", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: var(--term);
    overflow: hidden;
    -webkit-font-smoothing: none;
    user-select: none;
  }

  /* ---------- background layers ---------- */
  #scene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    opacity: 0;
    transition: opacity 1.2s steps(6);
  }
  body.playing #scene { opacity: 1; }
  #scanlines {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
    z-index: 5;
  }
  #startScene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 0%;
  }
  body.playing #startScene { display: none; }

  /* ---------- start screen ---------- */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 2.2vh; padding: 3vh 16px 16px; text-align: center;
  }
  body.playing #start { display: none; }
  .logo {
    --logo: min(240px, 30vh, 62vw);
    width: var(--logo); height: var(--logo); flex: none;
    border-radius: 50%;
    border: 6px solid var(--gold);
    box-shadow: 0 0 0 6px var(--gold-dark), 6px 10px 0 6px rgba(0,0,0,.35);
    background: radial-gradient(circle, #1b2fa8, #050a2e 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--logo) * 0.030); padding: calc(var(--logo) * 0.080);
  }
  .logo .small { font-family: var(--term); font-size: calc(var(--logo) * 0.110); color: #cfe0ff; letter-spacing: 1px; line-height: 1; }
  .logo .big {
    font-family: var(--term); font-size: calc(var(--logo) * 0.190); line-height: .85;
    color: var(--gold); text-shadow: calc(var(--logo) * 0.012) calc(var(--logo) * 0.012) 0 var(--gold-dark), calc(var(--logo) * 0.024) calc(var(--logo) * 0.024) 0 #000;
  }
  .logo .q { font-family: var(--pixel); font-size: calc(var(--logo) * 0.120); color: var(--gold); text-shadow: calc(var(--logo) * 0.010) calc(var(--logo) * 0.010) 0 #000; }

  .btn {
    font-family: var(--pixel);
    font-size: clamp(16px, 3.5vw, 24px);
    color: #fff;
    background: var(--blue);
    border: none;
    padding: 18px 44px;
    cursor: pointer;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
    box-shadow: inset 0 0 0 4px var(--gold);
    position: relative;
  }
  .btn::before {
    content: ""; position: absolute; inset: 0;
    clip-path: inherit;
    border: 4px solid var(--gold);
    pointer-events: none;
  }
  .btn:hover, .btn:focus-visible { background: var(--gold); color: #000; outline: none; }
  .btn:active { transform: translateY(3px); }
  @media (min-aspect-ratio: 6/5) {
    #start { align-items: flex-start; }
    #start .logo { --logo: min(200px, 26vh, 30vw); }
  }
  #startBar { position: absolute; left: 0; right: 0; bottom: 3vh; display: flex; justify-content: center; }
  #startBtn { animation: blink 1s steps(2) infinite; }
  #startBtn:hover { animation: none; }
  @keyframes blink { 50% { filter: brightness(1.35); } }

  /* ---------- game HUD ---------- */
  #game { position: fixed; inset: 0; z-index: 10; display: none; }
  body.playing #game { display: block; }

  #ladder {
    position: absolute; top: 16px; right: 16px;
    background: rgba(5,10,46,.85);
    border: 4px solid var(--gold);
    font-family: var(--pixel); font-size: 12px;
    min-width: 54px;
  }
  #ladderToggle {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 10px 12px;
    font-family: var(--pixel); font-size: 16px;
    background: none; border: none; color: var(--gold); cursor: pointer;
  }
  #ladderToggle:hover { background: var(--gold); color: #000; }
  #ladderToggle .of, #ladderToggle .arrow { font-size: 10px; }
  #ladder.collapsed #ladderToggle .of, #ladder.collapsed #ladderToggle .arrow { display: none; }
  #ladder.collapsed #ladderList { display: none; }
  #ladderList { display: flex; flex-direction: column-reverse; gap: 6px; padding: 4px 14px 12px; min-width: 150px; }
  #ladderList div { padding: 4px 8px; color: #8fa6ff; display: flex; justify-content: space-between; gap: 12px; }
  #ladderList div.done { color: #fff; }
  #ladderList div.done::after { content: "✓"; font-family: var(--term); font-size: 18px; line-height: 10px; }
  #ladderList div.now { background: var(--gold); color: #000; }

  #topbar {
    position: absolute; top: 16px; left: 16px;
    display: flex; gap: 10px;
  }
  .icon {
    font-family: var(--pixel); font-size: 12px;
    background: rgba(5,10,46,.82); color: #fff;
    border: 4px solid var(--gold); padding: 10px 12px; cursor: pointer;
  }
  .icon:hover { background: var(--gold); color: #000; }

  #timer {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 16px;
    width: 150px; height: 150px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s steps(3);
  }
  #timer.on { opacity: 1; }
  #timer canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #timeText {
    position: relative;
    font-family: var(--pixel); font-size: 26px; color: #fff;
    text-shadow: 3px 3px 0 #000;
  }
  #timer.low #timeText { color: var(--red); animation: blink .5s steps(2) infinite; }
  #timer.paused #timeText { animation: blink 1s steps(2) infinite; color: #8fa6ff; }

  /* ---------- question panel ---------- */
  #panel {
    position: absolute; left: 0; right: 0; bottom: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 0 16px;
  }
  .rail { position: relative; width: 100%; display: flex; justify-content: center; }
  .rail::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px;
    background: var(--gold); transform: translateY(-50%);
  }
  #qbox {
    position: relative;
    width: min(1100px, 100%);
    min-height: 150px;
    background: linear-gradient(#0b1a6b, #050a2e 55%, #0b1a6b);
    padding: 22px 64px;
    clip-path: polygon(48px 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 48px 100%, 0 50%);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #qbox::before {
    content: ""; position: absolute; inset: 0;
    background: var(--gold);
    clip-path: polygon(48px 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 48px 100%, 0 50%,
                       6px 50%, 50px calc(100% - 5px), calc(100% - 50px) calc(100% - 5px), calc(100% - 6px) 50%,
                       calc(100% - 50px) 5px, 50px 5px, 6px 50%, 0 50%);
  }
  #qtext {
    position: relative;
    font-family: var(--term);
    font-size: clamp(24px, 3.1vw, 38px);
    line-height: 1.15;
    text-align: center;
    margin: 0;
    white-space: pre-wrap;
    text-shadow: 2px 2px 0 #000;
  }
  #qtext .head { color: var(--gold); }
  #qtext .cursor { display: inline-block; width: .5em; height: 1em; background: #fff; vertical-align: -0.12em; animation: blink .6s steps(2) infinite; }
  #qlabel {
    position: relative;
    font-family: var(--pixel); font-size: 14px;
    background: var(--navy); color: var(--gold);
    border: 4px solid var(--gold); padding: 8px 16px;
  }
  #controls { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #controls .btn { font-size: 13px; padding: 14px 32px; }
  .hidden { visibility: hidden; }

  #timesUp {
    position: absolute; left: 50%; top: 30%;
    transform: translate(-50%, -50%);
    font-family: var(--pixel); font-size: clamp(22px, 5vw, 44px);
    color: var(--red); text-shadow: 4px 4px 0 #000;
    background: rgba(5,10,46,.85); border: 4px solid var(--red);
    padding: 20px 28px; display: none; text-align: center;
  }
  #timesUp.on { display: block; animation: blink .4s steps(2) 6; }

  /* ---------- end ---------- */
  #end {
    position: fixed; inset: 0; z-index: 12; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    text-align: center; padding: 16px;
  }
  body.finished #end { display: flex; }
  body.finished #panel, body.finished #timer { display: none; }
  #end h1 {
    font-family: var(--term); font-weight: normal;
    font-size: clamp(48px, 10vw, 96px); margin: 0;
    color: var(--gold); text-shadow: 4px 4px 0 var(--gold-dark), 8px 8px 0 #000;
  }
  #end p { font-size: clamp(24px, 4vw, 36px); margin: 0; text-shadow: 2px 2px 0 #000; background: rgba(5,10,46,.8); padding: 8px 18px; }

  @media (max-width: 760px) {
    #ladder { right: auto; left: 16px; top: 66px; }
    #qbox { padding: 18px 34px; clip-path: polygon(24px 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 24px 100%, 0 50%); }
    #qbox::before { clip-path: polygon(24px 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 24px 100%, 0 50%,
                       5px 50%, 26px calc(100% - 4px), calc(100% - 26px) calc(100% - 4px), calc(100% - 5px) 50%,
                       calc(100% - 26px) 4px, 26px 4px, 5px 50%, 0 50%); }
    #timer { width: 104px; height: 104px; left: auto; right: 16px; transform: none; }
    #timeText { font-size: 18px; }
  }
  /* tall screens: show the whole picture instead of cropping people out */
  @media (max-aspect-ratio: 6/5) {
    body:not(.playing) { background: #4d9fe4; }
    #startScene { object-fit: contain; }
    #scene { object-fit: contain; object-position: 50% 30%; }
    #startScene { object-position: 50% 100%; }
    #start { justify-content: center; padding-bottom: calc(79vw + 16px); }
    #start .logo { --logo: min(300px, 72vw, 42vh); }
    #startBar { position: static; }
  }
</style>
</head>
<body>
  <canvas id="scene" width="241" height="181"></canvas>
  <img id="startScene" alt="İki çocuk oyuncak vinç ve çekiçle ev inşa ediyor">
  <div id="scanlines"></div>

  <section id="start">
    <div class="logo">
      <div class="small">KİM BİR</div>
      <div class="big">GELECEK<br>İNŞA</div>
      <div class="small">ETMEK İSTER <span class="q">?</span></div>
    </div>
    <div id="startBar"><button class="btn" id="startBtn">START</button></div>
  </section>

  <section id="game">
    <div id="topbar">
      <button class="icon" id="muteBtn" title="Ses">SES: AÇIK</button>
    </div>
    <div id="ladder" class="collapsed">
      <button id="ladderToggle" title="Soru listesini aç / kapat"><span id="ladderNow">1</span><span class="of">/ 12</span><span class="arrow">▲</span></button>
      <div id="ladderList"></div>
    </div>

    <div id="timer">
      <canvas id="ring" width="40" height="40"></canvas>
      <div id="timeText">8:00</div>
    </div>

    <div id="timesUp">SÜRE DOLDU!</div>

    <div id="panel">
      <div class="rail"><div id="qlabel">SORU 1 / 12</div></div>
      <div class="rail"><div id="qbox"><p id="qtext"></p></div></div>
      <div id="controls">
        <button class="btn hidden" id="pauseBtn">DURAKLAT</button>
        <button class="btn hidden" id="nextBtn">SONRAKİ ▶</button>
      </div>
    </div>
  </section>

  <section id="end">
    <h1>TEBRİKLER!</h1>
    <p>12 sorunun hepsi tamamlandı.</p>
    <button class="btn" id="restartBtn">TEKRAR</button>
  </section>

<script src="assets.js"></script>
<script>
(() => {
  const QUESTIONS = [
    "Geçmişe dönüş. Birlikte büyüdüğünüz yılları düşünün. Bu arsa size bir anıyı hatırlatıyor mu, ya da o günlerden bu evde olmasını istediğiniz bir his var mı?",
    "Neden? Bu parayla ve zamanla yapabileceğiniz onca şey varken neden bu, ve neden birlikte?",
    "Hayal. Bu evi hayal ettiğinizde ne görüyorsunuz?",
    "Beş ağaç. Bahçeye sadece beş ağaç dikebilseydiniz hangileri olurdu, ve neden?",
    "El emeği. Orada kendi ellerinizle yapmak istediğiniz bir şey var mı: bir çardak, taş duvar, pizza fırını, ağaç ev?",
    "Tek lüks. Para hiç sorun olmasaydı ve sadece bir özellik seçebilseydiniz, ne olurdu: havuz, dış mutfak, denize bakan büyük bir cam duvar?",
    "İlk eşyalar. Eve ilk olarak her biriniz ne getirirdiniz?",
    "İlk yolculuk. Oraya birlikte ilk ne zaman gideceksiniz, ve o günün planı ne?",
    "Misafir listesi. İki aile dışında, kalmaya ilk kimi davet ederdiniz?",
    "Kimin için? Burası bir aile yazlığı mı, emeklilik yeri mi, kiraya verilecek bir yer mi, yoksa çocuklara kalacak bir miras mı?",
    "On yıl sonra. Sizce bu arsa (ve çevresi) 10 yıl sonra nerede olacak? Satmanıza ne sebep olurdu, yan arsayı almanıza ne sebep olurdu?",
    "Dürüst soru. Her biriniz içten içe neyden biraz endişeleniyor, ve bunu ne kolaylaştırırdı?",
  ];
  // ?t=10 shortens each question to 10 seconds, handy for a rehearsal
  const QUESTION_SECONDS = Number(new URLSearchParams(location.search).get("t")) || 8 * 60;
  const TYPE_MS = 45;

  const $ = id => document.getElementById(id);
  const body = document.body;

  /* ================= SOUND (tiny 8-bit synth) ================= */
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type = "square", vol = 0.06, when = 0) {
    if (muted || !audio()) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    blip: () => tone(660 + Math.random() * 80, 0.03, "square", 0.025),
    start: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, "square", 0.06, i * 0.12)),
    reveal: () => [784, 1047].forEach((f, i) => tone(f, 0.12, "triangle", 0.08, i * 0.1)),
    tick: () => tone(1200, 0.04, "square", 0.04),
    buzz: () => { tone(110, 0.9, "sawtooth", 0.08); tone(116, 0.9, "sawtooth", 0.06); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, "square", 0.06, i * 0.14)),
  };

  /* ================= 8-BIT SCENE + FLICKERING CANDLE ================= */
  const scene = $("scene"), sctx = scene.getContext("2d");
  const W = scene.width, H = scene.height;
  const bg = new Image();
  let bgData = null;
  bg.onload = () => {
    sctx.drawImage(bg, 0, 0, W, H);
    bgData = sctx.getImageData(0, 0, W, H);
  };
  bg.src = ASSETS.table.bg;

  // Candle position in the 241x181 pixel grid (where the table lamp stood)
  const CX = 117, BASE = 114;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16);
  const LEVELS = 6;

  let flick = 1, flickTarget = 1, sway = 0;
  function drawScene(now) {
    if (!bgData) return;
    // flicker: wander toward random targets, with the odd sharp dip
    if (Math.random() < 0.3) flickTarget = 0.8 + Math.random() * 0.25;
    if (Math.random() < 0.04) flickTarget = 0.65;
    flick += (flickTarget - flick) * 0.4;
    if (Math.random() < 0.15) sway = Math.round(Math.random() * 2 - 1);

    const out = sctx.createImageData(W, H);
    const s = bgData.data, d = out.data;
    const lx = CX + sway * 0.5, ly = BASE - 46;
    const radius = 62 * flick;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const dx = x - lx, dy = (y - ly) * 1.15;
        let l = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / radius);
        l = l * l * flick;
        // ordered dither into a few light bands for a chunky 8-bit glow
        const q = Math.min(LEVELS, Math.floor(l * LEVELS + BAYER[(y & 3) * 4 + (x & 3)] * 0.6)) / LEVELS;
        d[i]     = Math.min(255, s[i] * (0.92 + q * 0.6) + q * 40);
        d[i + 1] = Math.min(255, s[i + 1] * (0.92 + q * 0.4) + q * 18);
        d[i + 2] = Math.min(255, s[i + 2] * (0.92 + q * 0.05));
        d[i + 3] = 255;
      }
    }
    sctx.putImageData(out, 0, 0);
    drawCandle(now);
  }

  function px(x, y, w, h, c) { sctx.fillStyle = c; sctx.fillRect(x, y, w, h); }
  // rows centred on CX: [y, halfWidth, colour]
  function row(y, hw, c) { px(CX - hw, y, hw * 2 + 1, 1, c); }
  function drawCandle(now) {
    const B = BASE, DK = "#5a3c0c", MD = "#b8862a", LT = "#f0c050", HI = "#fff0a0";
    // brass candlestick: foot
    row(B, 6, DK); row(B - 1, 5, MD); row(B - 2, 4, LT); row(B - 3, 2, MD);
    px(CX - 2, B - 2, 1, 1, HI);
    // stem with a knob
    px(CX - 1, B - 22, 3, 19, MD);
    px(CX - 1, B - 22, 1, 19, LT);
    px(CX + 1, B - 22, 1, 19, DK);
    row(B - 13, 2, MD); px(CX - 2, B - 13, 1, 1, HI);
    row(B - 12, 1, DK);
    // drip tray
    row(B - 23, 5, DK); row(B - 24, 4, LT); px(CX - 3, B - 24, 1, 1, HI);
    // wax candle
    px(CX - 3, B - 40, 6, 16, "#efe4c4");
    px(CX - 3, B - 40, 1, 16, "#fffbea");
    px(CX + 2, B - 40, 1, 16, "#bdb08a");
    px(CX - 2, B - 40, 4, 1, "#ffffff");
    px(CX + 1, B - 39, 1, 4, "#fffbea");   // drip
    px(CX - 2, B - 37, 1, 2, "#ffffff");
    // wick
    px(CX, B - 42, 1, 2, "#2a1a10");
    // flame
    const h = flick > 0.98 ? 9 : flick > 0.88 ? 8 : flick > 0.75 ? 7 : 6;
    const fx = CX + sway;
    const top = B - 42 - h;
    const frame = Math.floor(now / 100) % 4;
    px(fx - 1, top + 3, 3, h - 3, "#ff7a00");
    px(fx - 2, top + 5, 5, h - 6, "#ff7a00");
    px(fx, top, 1, h, "#ffb000");
    px(fx - 1, top + 4, 3, h - 6, "#ffd040");
    px(fx, top + 3, 1, h - 5, "#fff6c0");
    if (frame === 1) px(fx + 1, top + 1, 1, 2, "#ff9a00");
    if (frame === 3) px(fx - 1, top + 1, 1, 2, "#ff9a00");
    px(fx, top + h - 1, 1, 1, "#3c8cff"); // blue root of the flame
  }

  /* ================= START SCREEN ================= */
  $("startScene").src = ASSETS.start.bg;

  let lastFrame = 0;
  function loop(now) {
    if (now - lastFrame > 80) { // ~12fps, very 8-bit
      lastFrame = now;
      if (body.classList.contains("playing")) drawScene(now);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ================= TIMER RING (pixel) ================= */
  const ring = $("ring"), rctx = ring.getContext("2d");
  function drawRing(frac, low) {
    const N = 40, c = N / 2 - 0.5;
    rctx.clearRect(0, 0, N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = x - c, dy = y - c, r = Math.sqrt(dx * dx + dy * dy);
      if (r > 19.5) continue;
      if (r < 15.5) { if (r < 14.5) { rctx.fillStyle = "rgba(5,10,46,.9)"; rctx.fillRect(x, y, 1, 1); } continue; }
      let a = Math.atan2(dx, -dy) / (2 * Math.PI); if (a < 0) a += 1;
      rctx.fillStyle = a <= frac ? (low ? "#ff4040" : "#f8c840") : "#1a2468";
      rctx.fillRect(x, y, 1, 1);
    }
  }

  /* ================= GAME FLOW ================= */
  const ladderList = $("ladderList");
  QUESTIONS.forEach((_, i) => {
    const el = document.createElement("div");
    el.innerHTML = `<span>${i + 1}</span>`;
    ladderList.appendChild(el);
  });
  try { if (localStorage.getItem("ladderOpen") === "1") $("ladder").classList.remove("collapsed"); } catch (e) {}
  $("ladderToggle").addEventListener("click", () => {
    const open = $("ladder").classList.toggle("collapsed") === false;
    try { localStorage.setItem("ladderOpen", open ? "1" : "0"); } catch (e) {}
  });

  let idx = 0, typingTimer = null, typed = 0, typingDone = false;
  let remaining = QUESTION_SECONDS, running = false, endAt = 0, tickTimer = null, lastShown = -1;

  function splitHead(q) {
    const m = q.match(/^(.*?[.?])\s/);
    return m ? [m[1], q.slice(m[1].length)] : ["", q];
  }
  function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

  function renderTyped(full, n) {
    const [head, rest] = splitHead(full);
    const hShow = full.slice(0, Math.min(n, head.length));
    const rShow = n > head.length ? rest.slice(0, n - head.length) : "";
    $("qtext").innerHTML = `<span class="head">${esc(hShow)}</span>${esc(rShow)}` +
      (n < full.length ? `<span class="cursor"></span>` : "");
  }


  function updateLadder() {
    [...ladderList.children].forEach((el, i) => {
      el.className = i < idx ? "done" : i === idx ? "now" : "";
    });
    $("ladderNow").textContent = Math.min(idx + 1, QUESTIONS.length);
  }

  function showQuestion(i) {
    idx = i;
    stopTimer();
    $("timesUp").classList.remove("on");
    $("timer").classList.remove("on", "low", "paused");
    $("pauseBtn").classList.add("hidden");
    $("nextBtn").classList.add("hidden");
    $("nextBtn").textContent = i === QUESTIONS.length - 1 ? "BİTİR ▶" : "SONRAKİ ▶";
    $("qlabel").textContent = `SORU ${i + 1} / ${QUESTIONS.length}`;
    updateLadder();

    const full = QUESTIONS[i];
    typed = 0; typingDone = false;
    // reserve final height so the panel doesn't jump while typing
    $("qtext").style.minHeight = "";
    renderTyped(full, full.length);
    $("qtext").style.minHeight = $("qtext").offsetHeight + "px";
    renderTyped(full, 0);

    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
      typed++;
      renderTyped(full, typed);
      if (full[typed - 1] && full[typed - 1] !== " ") sfx.blip();
      if (typed >= full.length) finishTyping();
    }, TYPE_MS);
  }

  function finishTyping() {
    if (typingDone) return;
    typingDone = true;
    clearInterval(typingTimer);
    renderTyped(QUESTIONS[idx], QUESTIONS[idx].length);
    sfx.reveal();
    remaining = QUESTION_SECONDS;
    $("timer").classList.add("on");
    $("pauseBtn").classList.remove("hidden");
    $("pauseBtn").textContent = "DURAKLAT";
    $("nextBtn").classList.remove("hidden");
    startTimer();
  }

  function fmt(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

  function renderTimer() {
    const low = remaining <= 30;
    $("timeText").textContent = fmt(remaining);
    $("timer").classList.toggle("low", low && remaining > 0);
    drawRing(remaining / QUESTION_SECONDS, low);
  }

  function startTimer() {
    running = true;
    endAt = performance.now() + remaining * 1000;
    $("timer").classList.remove("paused");
    lastShown = Math.ceil(remaining);
    renderTimer();
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      remaining = (endAt - performance.now()) / 1000;
      const shown = Math.ceil(remaining);
      if (shown !== lastShown) {
        lastShown = shown;
        if (shown <= 10 && shown > 0) sfx.tick();
      }
      if (remaining <= 0) { remaining = 0; renderTimer(); timeUp(); return; }
      renderTimer();
    }, 100);
  }
  function stopTimer() { running = false; clearInterval(tickTimer); }

  function timeUp() {
    stopTimer();
    sfx.buzz();
    $("timesUp").classList.add("on");
    $("pauseBtn").classList.add("hidden");
  }

  function togglePause() {
    if (!typingDone || remaining <= 0) return;
    if (running) {
      remaining = (endAt - performance.now()) / 1000;
      stopTimer();
      $("timer").classList.add("paused");
      $("pauseBtn").textContent = "DEVAM";
    } else {
      $("pauseBtn").textContent = "DURAKLAT";
      startTimer();
    }
  }

  function next() {
    if (!typingDone) return;
    if (idx < QUESTIONS.length - 1) showQuestion(idx + 1);
    else finish();
  }

  function finish() {
    stopTimer();
    idx = QUESTIONS.length;
    updateLadder();
    $("timesUp").classList.remove("on");
    body.classList.add("finished");
    sfx.win();
  }

  function startGame() {
    audio();
    sfx.start();
    body.classList.remove("finished");
    body.classList.add("playing");
    showQuestion(0);
  }

  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("nextBtn").addEventListener("click", next);
  $("pauseBtn").addEventListener("click", togglePause);
  $("qbox").addEventListener("click", () => { if (!typingDone) finishTyping(); });
  $("muteBtn").addEventListener("click", () => {
    muted = !muted;
    $("muteBtn").textContent = muted ? "SES: KAPALI" : "SES: AÇIK";
  });
  document.addEventListener("keydown", e => {
    if (!body.classList.contains("playing") || body.classList.contains("finished")) return;
    if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); typingDone ? next() : finishTyping(); }
    else if (e.key === " ") { e.preventDefault(); typingDone ? togglePause() : finishTyping(); }
  });
})();
</script>
</body>
</html>
